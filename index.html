<!DOCTYPE html>
<html>
<head>
    <title>INDU4 Local Storage Explorer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #1f6b9c; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status { font-weight: bold; color: #2d8a2d; }
        button { padding: 10px 15px; cursor: pointer; background: #d11a2a; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stored Videos in INDU4</h2>
    <p id="db-status">Checking database...</p>
    <table id="file-table">
        <thead>
            <tr>
                <th>File Name (Key)</th>
                <th>Data Type</th>
                <th>Approx. Size</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
    <br>
    <button onclick="clearDatabase()">Wipe INDU4 Database</button>
</div>

<script>
    const DB_NAME = "INDU4";
    const STORE_NAME = "indu4";

    function loadData() {
        const request = indexedDB.open(DB_NAME);

        request.onsuccess = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                document.getElementById('db-status').innerText = "Database is empty or not created yet.";
                return;
            }

            const transaction = db.transaction(STORE_NAME, "readonly");
            const store = transaction.objectStore(STORE_NAME);
            const getAll = store.getAll();

            getAll.onsuccess = () => {
                const items = getAll.result;
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                
                if (items.length === 0) {
                    document.getElementById('db-status').innerText = "No files found in storage.";
                } else {
                    document.getElementById('db-status').innerText = `Found ${items.length} files:`;
                    items.forEach(item => {
                        const row = tbody.insertRow();
                        // item.name is the key, item.data is the ArrayBuffer
                        const size = item.data ? (item.data.byteLength / (1024 * 1024)).toFixed(2) + " MB" : "Unknown";
                        
                        row.innerHTML = `
                            <td>${item.name}</td>
                            <td>Video/Blob</td>
                            <td>${size}</td>
                        `;
                    });
                }
            };
        };

        request.onerror = () => {
            document.getElementById('db-status').innerText = "Error opening database.";
        };
    }

    function clearDatabase() {
        if (confirm("Are you sure you want to delete all locally stored videos?")) {
            const req = indexedDB.deleteDatabase(DB_NAME);
            req.onsuccess = () => {
                alert("Database deleted. Refresh the page.");
                location.reload();
            };
        }
    }

    // Run on load
    loadData();
</script>

</body>
</html>
