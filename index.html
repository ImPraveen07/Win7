<!DOCTYPE html>
<html>
<head>
    <title>INDU4 - Simple View</title>
    <style>
        body { font-family: sans-serif; background: #ffe6f2; padding: 20px; color: #ff69b4; }
        .box { background: white; padding: 20px; border-radius: 15px; border: 3px solid #ffb3d9; }
        table { width: 100%; border-collapse: collapse; background: white; color: #333; }
        th, td { padding: 10px; border: 1px solid #ffb3d9; text-align: left; }
        th { background: #ff69b4; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>✨ INDU4 Storage Inspector</h2>
    <table id="list">
        <thead>
            <tr>
                <th>File Name (Key)</th>
                <th>File Size</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const dbReq = indexedDB.open("INDU4", 2); // Version 2 to match your code

    dbReq.onsuccess = (e) => {
        const db = e.target.result;
        const tx = db.transaction("indu4", "readonly");
        const store = tx.objectStore("indu4");
        
        // Use a cursor to walk through the files
        store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
                const tbody = document.querySelector("#list tbody");
                const row = tbody.insertRow();
                
                // The Key is the filename in your code
                const fileName = cursor.key; 
                // The Value is the Blob in your code
                const fileBlob = cursor.value; 
                
                const size = (fileBlob.size / (1024 * 1024)).toFixed(2) + " MB";

                row.innerHTML = `<td>${fileName}</td><td>${size}</td>`;
                cursor.continue();
            }
        };
    };
</script>
</body>
</html>
