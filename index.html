<!DOCTYPE html>
<html>
<head>
    <title>INDU5 - Debugger</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #ffe6f2; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 15px; border: 4px solid #ffb3d9; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        h2 { color: #ff69b4; text-align: center; border-bottom: 2px dashed #ffb3d9; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ffb3d9; text-align: left; font-size: 13px; }
        th { background: #ff69b4; color: white; }
        .type-tag { font-size: 10px; padding: 2px 6px; background: #eee; border-radius: 4px; color: #666; }
    </style>
</head>
<body>

<div class="box">
    <h2>✨ INDU5 Internal Storage Explorer</h2>
    <table id="list">
        <thead>
            <tr>
                <th>File Name (Key)</th>
                <th>Storage Type</th>
                <th>File Size</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    // 1. MUST MATCH YOUR MAIN CODE EXACTLY
    const DB_NAME = "INDU5";
    const STORE_NAME = "indu5"; 

    const dbReq = indexedDB.open(DB_NAME, 2);

    dbReq.onerror = (e) => console.error("Database Error:", e);

    dbReq.onsuccess = (e) => {
        const db = e.target.result;
        
        // 2. CHECK IF THE STORE EXISTS
        if (!db.objectStoreNames.contains(STORE_NAME)) {
            document.getElementById('table-body').innerHTML = 
                `<tr><td colspan="3" style="color:red; text-align:center;">
                Error: Store '${STORE_NAME}' not found in ${DB_NAME}!
                </td></tr>`;
            return;
        }

        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const tbody = document.getElementById('table-body');
        
        store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
                const row = tbody.insertRow();
                const key = cursor.key;
                const value = cursor.value;
                
                let displaySize = "0 MB";
                let dataType = typeof value;

                if (value instanceof Blob) {
                    displaySize = (value.size / (1024 * 1024)).toFixed(2) + " MB";
                    dataType = "Blob/File";
                } 
                else if (value instanceof ArrayBuffer) {
                    displaySize = (value.byteLength / (1024 * 1024)).toFixed(2) + " MB";
                    dataType = "ArrayBuffer";
                }
                else if (value && typeof value === 'object') {
                    dataType = "Object";
                    if (value.data) {
                        const inner = value.data;
                        const bytes = inner.byteLength || inner.size || 0;
                        displaySize = (bytes / (1024 * 1024)).toFixed(2) + " MB";
                    }
                }

                row.innerHTML = `
                    <td><b>${key}</b></td>
                    <td><span class="type-tag">${dataType}</span></td>
                    <td>${displaySize}</td>
                `;
                
                cursor.continue();
            } else if (tbody.rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Database is connected but empty.</td></tr>`;
            }
        };
    };
</script>
</body>
</html>
